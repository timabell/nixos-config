# Evaluate every config (no builds): catches typos, missing overlays and
# vanished inputs. Build-time failures (e.g. stale vendorHash) still need
# a local rebuild. Actions pinned by SHA for supply-chain safety.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix flake check --no-build
